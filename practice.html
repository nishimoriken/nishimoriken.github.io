<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nishimorigram</title>
    <style>
        .header {
            padding: 16px 20px;
            max-width: 935px;
            margin: 0 auto;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
        }

        .img_header {
            width: 150px;
            height: auto;
        }

        .img_icon {
            width: 150px;
        }

        .main {
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Profile Section */
        .profile {
            display: flex;
            gap: 44px;
            align-items: flex-start;
            padding: 44px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .profile > div:first-child {
            flex-shrink: 0;
        }

        .profile > div:first-child div {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: clip;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #e5e5e5;
            font-size: 60px;
        }

        .profile > div:last-child {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-name {
            font-size: 32px;
            font-weight: 300;
        }

        .verify-badge {
            background-color: #0095f6;
            color: white;
            font-size: 14px;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-stats {
            display: flex;
            font-size: 16px;
            gap: 40px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-number {
            font-weight: 600;
        }
        
        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .profile-info div:first-child {
            font-weight: 600;
        }

        .stories {
            display: flex;
            gap: 8px;
            padding: 20px 0;
            border-bottom: 1px solid #e5e5e5;
            overflow-x: auto;
        }

        .story {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            border: 2px solid #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
            flex-shrink: 0;
            font-size: 12px;
            text-align: center;
            padding: 4px;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e5;
            margin-top: 20px;
        }

        .tab {
            text-align: center;
            padding: 16px 0;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
            transition: opacity 0.3s;
            flex: 1;
        }

        .tab:hover {
            opacity: 1;
        }

        .tab.active {
            opacity: 1;
            border-top: 1px solid #000;
        }

        .tab-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .tab-image {
            width: 60px;
        }

        /* Posts Grid */
        .posts-section {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background-color: #fff;
            padding: 1px 1px;
        }

        .posts-row {
            display: contents;
        }

        .post {
            aspect-ratio: 2 / 3;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 0;
            cursor: pointer;
        }

        .post:hover {
            background-color: #e8e8e8;
        }

        .post-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .footer-logo {
            width: 100px;
            height: auto;
        }
        
        footer {
            margin: 20px;
        }

        footer div {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            opacity: 0.4;
        }

        footer div span {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 735px) {
            .profile {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }

            .profile > div:first-child div {
                width: 120px;
                height: 120px;
            }

            .profile > div:last-child {
                width: 100%;
                text-align: left;
            }

            .profile-header {
                flex-wrap: wrap;
            }

            .tabs {
                gap: 8px;
            }

            .post-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            footer {
                display: flex;
                flex-direction: column;
            }

            footer > div:first-child {
                display: flex;
                flex-direction: column;
            }

        }

    </style>
